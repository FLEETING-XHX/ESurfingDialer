name: esurfing-native-v300
services:
  native:
    build: .
    image: "${DIALER_IMAGE:-esurfing-dialer-native:v3.0.0-amd64}"
    container_name: ESurfingDialerNative-v3.0.0
    network_mode: host
    # Explicit experimental opt-in is required; never replace the existing Kotlin service.
    restart: "no"
    env_file: .env
    environment:
      STATE_DIR: /data
      NATIVE_EXPERIMENTAL: "${NATIVE_EXPERIMENTAL:-0}"
      TZ: "${TZ:-Asia/Shanghai}"
    volumes:
      - native-state:/data
    stop_grace_period: 10s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=4m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "3"}
volumes:
  native-state:
